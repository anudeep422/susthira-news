name: Deploy Susthira News to Firebase
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check stories.json is valid
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open("public/stories.json"))
          s = d["stories"]
          assert len(s) >= 6, "too few stories"
          for x in s:
              assert x["s"] in ("business", "technology", "sports", "entertainment"), x["s"]
              for l in ("en", "te"):
                  assert x[l]["h"] and x[l]["p"], "missing text"
          print("OK:", len(s), "stories")
          PY
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SUSTHIRACONSULTANTS }}
          projectId: susthiraconsultants
          channelId: live
